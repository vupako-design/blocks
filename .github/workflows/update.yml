name: Обновление данных
on:
  workflow_dispatch:
    inputs:
      n:
        description: номер попытки
        default: '1'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node update.js
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
      - run: cp index.html logic.js sw.js manifest.json icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v5
  retry: # не вышло — пробуем ещё раз (всего до 3 попыток)
    needs: deploy
    if: failure() && fromJSON(inputs.n || '1') < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main -f n=$(( ${{ inputs.n || 1 }} + 1 ))
