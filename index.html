<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b7f3b">
<title>Блоки: CPMV</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;background:#f2f2f2;color:#111}
label{display:block;margin:12px;padding:14px;background:#1b7f3b;color:#fff;text-align:center;border-radius:10px;font-weight:600}
input{display:none}#s{display:flex;flex-wrap:wrap;gap:6px;margin:0 12px 8px;max-height:30vh;overflow:auto}
#s button{border:0;padding:6px 12px;border-radius:16px;background:#fff;font:inherit}#s .on{background:#1b7f3b;color:#fff}#n{margin:0 12px 8px;color:#666}
.c{margin:8px 12px;padding:10px 12px;background:#fff;border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.t{cursor:pointer;font-size:24px;font-weight:800;line-height:1.2}.p{font-size:20px;font-weight:700;text-align:right}.b{grid-column:1/3;color:#444;font-size:14px;margin-bottom:2px}.m{color:#555;font-size:14px}
.g{background:#c8f0d2;color:#0a5c22;padding:0 6px;border-radius:5px;font-weight:700}
</style></head><body>
<label>Выбрать файл .xlsx<input id="f" type="file" accept=".xlsx"></label>
<div id="s"></div><div id="n"></div><div id="l"></div>
<script src="logic.js?v=5"></script>
<script>
let rows = [], sel = '', upd = '';
const show = () => {
  const v = sel ? rows.filter((r) => r.geo === sel) : rows;
  n.textContent = `Найдено: ${v.length}${upd}`;
  s.innerHTML = ['', ...new Set(rows.map((r) => r.geo))].sort().map((g) => `<button class="${g === sel ? 'on' : ''}">${g || 'Все'}</button>`).join('');
  l.innerHTML = v.map((r) => `<div class="c"><div class="t">${r.geo}</div><div class="p">${r.cpmv.toFixed(2)} ₽</div>
    <div class="b">${r.block}</div>
    <div class="m">Показы: <span class="${r.green ? 'g' : ''}">${r.shows}</span> · Клики: ${r.clicks}</div>
    <div class="m" style="text-align:right">Доход: ${r.reward.toFixed(2)} ₽</div></div>`).join('');
};
f.onchange = async () => { rows = process(await parseXlsx(await f.files[0].arrayBuffer())); sel = upd = ''; show(); };
s.onclick = (e) => { if (e.target.tagName === 'BUTTON') { sel = e.target.textContent === 'Все' ? '' : e.target.textContent; show(); } };
l.onclick = (e) => { if (e.target.className === 't') { sel = sel ? '' : e.target.textContent; show(); } };
// Данные кладёт на сайт GitHub (см. update.js), страница их просто читает.
const load = async () => {
  try {
    const d = await (await fetch('data.json', { cache: 'no-store' })).json();
    rows = d.rows; upd = ' · обновлено ' + new Date(d.updated).toLocaleString('ru', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    if (!rows.some((r) => r.geo === sel)) sel = '';
    show();
  } catch { rows.length || (n.textContent = 'Данных пока нет. На GitHub: Actions → Обновление данных → Run workflow'); }
};
load();
document.onvisibilitychange = () => document.hidden || load();
'serviceWorker' in navigator && navigator.serviceWorker.register('sw.js');
</script></body></html>
