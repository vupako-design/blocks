<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b7f3b">
<title>Блоки: CPMV</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;background:#f2f2f2;color:#111}
label{display:block;margin:12px;padding:14px;background:#1b7f3b;color:#fff;text-align:center;border-radius:10px;font-weight:600}
input{display:none}#s{display:flex;flex-wrap:wrap;gap:6px;margin:0 12px 8px;max-height:30vh;overflow:auto}
#s button{border:0;padding:6px 12px;border-radius:16px;background:#fff;font:inherit}#s .on{background:#1b7f3b;color:#fff}#n{margin:0 12px 8px;color:#666}
.c{margin:8px 12px;padding:10px 12px;background:#fff;border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.t{cursor:pointer;font-size:24px;font-weight:800;line-height:1.2}.p{font-size:20px;font-weight:700;text-align:right}.b{grid-column:1/3;color:#444;font-size:14px;margin-bottom:2px}.m{color:#555;font-size:14px}
.g{background:#c8f0d2;color:#0a5c22;padding:0 6px;border-radius:5px;font-weight:700}
</style></head><body>
<label>Выбрать файл .xlsx<input id="f" type="file" accept=".xlsx"></label>
<div id="s"></div><div id="n"></div><div id="l"></div>
<script src="logic.js?v=5"></script>
<script>
let rows = [], sel = '', upd = '';
const show = () => {
  const v = sel ? rows.filter((r) => r.geo === sel) : rows;
  n.textContent = `Найдено: ${v.length}${upd}`;
  s.innerHTML = ['', ...new Set(rows.map((r) => r.geo))].sort().map((g) => `<button class="${g === sel ? 'on' : ''}">${g || 'Все'}</button>`).join('');
  l.innerHTML = v.map((r) => `<div class="c"><div class="t">${r.geo}</div><div class="p">${r.cpmv.toFixed(2)} ₽</div>
    <div class="b">${r.block}</div>
    <div class="m">Показы: <span class="${r.green ? 'g' : ''}">${r.shows}</span> · Клики: ${r.clicks}</div>
    <div class="m" style="text-align:right">Доход: ${r.reward.toFixed(2)} ₽</div></div>`).join('');
};
f.onchange = async () => { rows = process(await parseXlsx(await f.files[0].arrayBuffer())); sel = upd = ''; show(); };
s.onclick = (e) => { if (e.target.tagName === 'BUTTON') { sel = e.target.textContent === 'Все' ? '' : e.target.textContent; show(); } };
l.onclick = (e) => { if (e.target.className === 't') { sel = sel ? '' : e.target.textContent; show(); } };
// Данные кладёт на сайт GitHub (см. update.js). При заходе просим GitHub обновить их и ждём свежий файл.
const [O, R] = [location.hostname.split('.')[0], location.pathname.split('/')[1]];
let cur = '', busy = 0;
const fresh = async () => (await fetch('data.json', { cache: 'no-store' })).json();
const apply = (d) => {
  rows = d.rows; cur = d.updated;
  upd = (d.total == null ? '' : ` · Доход за день: ${d.total.toFixed(2)} ₽`) + ' · обновлено ' + new Date(cur).toLocaleString('ru', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  if (!rows.some((r) => r.geo === sel)) sel = '';
  show();
};
const load = async () => { try { apply(await fresh()); } catch { rows.length || (n.textContent = 'Данных пока нет. На GitHub: Actions → Обновление данных → Run workflow'); } };
const refresh = async () => {
  if (busy || Date.now() - (localStorage.r || 0) < 3e4) return;
  const k = localStorage.k || prompt('Ключ GitHub для обновления (вводится один раз)');
  if (!k) return;
  busy = 1; localStorage.k = k; localStorage.r = Date.now();
  const t0 = Date.now(), tick = setInterval(() => (n.textContent = `Обновляю… ${Math.round((Date.now() - t0) / 1000)} с`), 500);
  try {
    const r = await fetch(`https://api.github.com/repos/${O}/${R}/actions/workflows/update.yml/dispatches`, { method: 'POST', headers: { Authorization: 'Bearer ' + k, Accept: 'application/vnd.github+json' }, body: '{"ref":"main"}' });
    if (r.status !== 204) throw new Error('GitHub ответил ' + r.status);
    for (let i = 0; i < 24; i++) {
      await new Promise((ok) => setTimeout(ok, 5000));
      const d = await fresh().catch(() => ({}));
      if (d.updated && d.updated !== cur) return apply(d);
    }
    throw new Error('не дождался свежих данных');
  } catch (e) {
    if (/ответил 40[134]/.test(e.message)) delete localStorage.k;
    show(); n.textContent += ' · не удалось обновить: ' + e.message;
  } finally { clearInterval(tick); busy = 0; }
};
// Ключ можно передать ссылкой: адрес приложения + #k=ключ (сохраняется и убирается из адресной строки)
if (location.hash.startsWith('#k=')) { localStorage.k = decodeURIComponent(location.hash.slice(3)); history.replaceState(null, '', location.pathname); }
const go = () => load().then(refresh);
go();
document.onvisibilitychange = () => document.hidden || go();
'serviceWorker' in navigator && navigator.serviceWorker.register('sw.js');
</script></body></html>
